<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--y:#ffe600;--t:#cfc6b4;--dim:#6b6455}
html,body{background:#000;color:var(--t);font:13px/1.5 'Courier New',Courier,monospace;min-height:100%}
#wrap{display:flex;gap:22px;padding:22px;flex-wrap:wrap;justify-content:center}
#left{flex:1 1 560px;max-width:760px}

.sub{color:var(--dim);font-size:12px;margin:2px 0 14px}

button:hover{border-color:var(--t)}button.main{background:var(--y);color:#000;border-color:var(--y)}
button:disabled{opacity:.35}
#info{color:var(--dim);font-size:12px}

.er{display:flex;align-items:center;gap:3px;margin:4px 0;flex-wrap:wrap}
.er .nm{width:62px;font-size:11px}
.er .c{width:26px;height:26px;padding:0;font-size:13px;letter-spacing:0;border-color:#2a2722;color:var(--t)}

function buildChain(ctx){const master=ctx.createGain();

 const dWet=ctx.createGain();dWet.gain.value=.22;const rev=ctx.createConvolver();const R=mulberry32((SEED^0x72657662)>>>0),len=Math.floor(ctx.sampleRate*1.9),buf=ctx.createBuffer(2,len,ctx.sampleRate);
 for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(R()*2-1)*Math.pow(1-i/len,2.6);}rev.buffer=buf;
 const dry=ctx.createGain(),wet=ctx.createGain(),out=ctx.createGain();
 const drums=ctx.createGain();drums.gain.value=.6;const comp=ctx.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;
 master.connect(delay);delay.connect(dWet);master.connect(dry);dWet.connect(rev);master.connect(rev);rev.connect(wet);dry.connect(out);wet.connect(out);
 drums.connect(out);const drev=ctx.createGain();drums.connect(drev);drev.connect(rev);
 const dbus={};DRUMS.forEach(d=>{const g=ctx.createGain(),sh=ctx.createWaveShaper(),p=ctx.createStereoPanner();g.connect(sh);sh.connect(p);p.connect(drums);dbus[d]={g,sh,p,in:g};});
 const ins={};BAND.forEach(k=>{const g=ctx.createGain(),p=ctx.createStereoPanner();/*band bus*/p.pan.value=PANS[k];g.connect(p);p.connect(master);ins[k]=g;});
 const syn=ctx.createGain();syn.connect(master);
 const lim=ctx.createDynamicsCompressor();lim.threshold.value=-3;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.002;lim.release.value=.08;const fin=ctx.createGain();fin.gain.value=.5;out.connect(comp);comp.connect(fin);fin.connect(lim);
 const ch={master,drums,dbus,ins,syn,out:lim,set(){master.gain.value=1.35;fin.gain.value=.5*K.master;delay.delayTime.value=K.dtime;fb.gain.value=K.fb;wet.gain.value=K.rev;drev.gain.value=.18*K.rev;syn.gain.value=K.synth;
  BAND.forEach(k=>ins[k].gain.value=K.vol[k]);DRUMS.forEach(d=>{const T=DT[d];dbus[d].sh.curve=curve(T.drive);dbus[d].p.pan.value=T.pan;dbus[d].g.gain.value=T.drive>0?1/(1+T.drive*1.5):1;});}};
 ch.set();return ch;}
function fire(ctx,ch,e,when){when=Math.max(ctx.currentTime||0,when);
 if(e.d){drum(ctx,when,e.d,e.st,e.v,ch.dbus[e.d].in);return;}
 if(e.ins){e.fs.forEach((f,i)=>INS[e.ins](ctx,when+(e.strum||0)*i,f,e.v,e.dur,ch.ins[e.ins]));return;}
 const keep=actx;actx=ctx;NR=mulberry32((SEED+Math.floor(when*1000))>>>0);SYN[e.syn](when,e.v,e.f,e.dur,ch.syn);actx=keep;}

// ================= live play =================
let ctx=null,ch=null,timer=null,nextBar=0,nextT=0,BARQ=[];
function start(){ctx=new (window.AudioContext||window.webkitAudioContext)();ch=buildChain(ctx);ch.out.connect(ctx.destination);nextBar=0;nextT=ctx.currentTime+.1;BARQ=[];
 timer=setInterval(()=>{while(nextT<ctx.currentTime+.4){const sps=60/bpmAt(nextBar)/4;barEvents(nextBar,sps).forEach(e=>fire(ctx,ch,e,nextT+e.t));BARQ.push({bar:nextBar,t:nextT,sps});nextT+=sps*16;nextBar++;}},40);
 $('bPlay').textContent='■ stop';draw();}
function stop(){if(REC)recStop();clearInterval(timer);timer=null;if(ctx)ctx.close();ctx=null;ch=null;$('bPlay').textContent='▶ play';edNow(-1);}
$('bPlay').onclick=()=>timer?stop():start();
function newPlan(){PLAN=plan();if(K.ens==='seed'){Object.assign(K.ins,PLAN.ens);syncUI();}if(!pianoEdited){PAT.piano=defaultPat('piano');buildEd();}info();}
$('bNew').onclick=()=>{SEED=(Math.random()*4294967296)>>>0;history.replaceState(null,'','?seed='+SEED);newPlan();if(timer){stop();start();}else draw();};

// ================= export =================
async function render(sec){const sr=44100,oc=new OfflineAudioContext(2,Math.ceil(sr*(sec+2)),sr),c=buildChain(oc);c.out.connect(oc.destination);
 let t=.05,bar=0;while(t<sec){const sps=60/bpmAt(bar)/4;barEvents(bar,sps).forEach(e=>{if(t+e.t<sec)fire(oc,c,e,t+e.t);});t+=sps*16;bar++;}
 return await oc.startRendering();}
function wav(buf){const n=buf.length,b=new ArrayBuffer(44+n*4),v=new DataView(b),w=(o,s)=>[...s].forEach((c,i)=>v.setUint8(o+i,c.charCodeAt(0)));
 w(0,'RIFF');v.setUint32(4,36+n*4,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,2,true);v.setUint32(24,buf.sampleRate,true);v.setUint32(28,buf.sampleRate*4,true);v.setUint16(32,4,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*4,true);
 const L=buf.getChannelData(0),R=buf.getChannelData(1);for(let i=0;i<n;i++){v.setInt16(44+i*4,clamp(L[i],-1,1)*32767,true);v.setInt16(46+i*4,clamp(R[i],-1,1)*32767,true);}return new Blob([b],{type:'audio/wav'});}
function mp3(buf){const enc=new lamejs.Mp3Encoder(2,buf.sampleRate,192),L=buf.getChannelData(0),R=buf.getChannelData(1),B=1152,parts=[],l=new Int16Array(B),r=new Int16Array(B),c16=x=>x>1?32767:x<-1?-32768:Math.round(x*32767);
 for(let i=0;i<buf.length;i+=B){const n=Math.min(B,buf.length-i);for(let k=0;k<n;k++){l[k]=c16(L[i+k]);r[k]=c16(R[i+k]);}const o=enc.encodeBuffer(l.subarray(0,n),r.subarray(0,n));if(o.length)parts.push(new Uint8Array(o.buffer,o.byteOffset,o.length).slice());}
 const o=enc.flush();if(o.length)parts.push(new Uint8Array(o.buffer,o.byteOffset,o.length).slice());return new Blob(parts,{type:'audio/mpeg'});}
function save(b,n){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),1000);}
async function exp(kind){const btn=$('bExp'),t0=btn.textContent,sec=clamp(+$('len').value||60,1,1800);btn.disabled=true;btn.textContent='rendering '+sec+'s…';try{const b=await render(sec);save(kind==='mp3'?mp3(b):wav(b),`goblin-candombe_${SEED}_${sec}s.${kind}`);}catch(e){btn.textContent='failed: '+e.message;console.error(e);}btn.disabled=false;setTimeout(()=>btn.textContent=t0,1500);}

$('bExp').onclick=()=>exp($('fmt').value);
// ---------- live recording: everything you hear, from rec to stop, with your knob moves ----------
let REC=null;
function recStart(){if(!timer)start();const sp=ctx.createScriptProcessor(4096,2,2),z=ctx.createGain();z.gain.value=0;ch.out.connect(sp);sp.connect(z);z.connect(ctx.destination);
 REC={sp,z,L:[],R:[],n:0,sr:ctx.sampleRate,t0:performance.now()};sp.onaudioprocess=e=>{if(!REC)return;REC.L.push(new Float32Array(e.inputBuffer.getChannelData(0)));REC.R.push(new Float32Array(e.inputBuffer.getChannelData(1)));REC.n+=e.inputBuffer.length;};
 $('bRec').textContent='■ stop rec';REC.tick=setInterval(()=>{const t=(performance.now()-REC.t0)/1000;$('recT').textContent='● '+Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0');},250);}
function recStop(){const r=REC;REC=null;clearInterval(r.tick);try{ch.out.disconnect(r.sp);r.sp.disconnect();r.z.disconnect();}catch(e){}$('bRec').textContent='● rec';$('recT').textContent='';
 if(!r.n)return;const cat=a=>{const o=new Float32Array(r.n);let k=0;a.forEach(x=>{o.set(x,k);k+=x.length;});return o;},L=cat(r.L),R=cat(r.R);
 const buf={sampleRate:r.sr,length:r.n,duration:r.n/r.sr,getChannelData:i=>i?R:L},kind=$('fmt').value;
 save(kind==='mp3'?mp3(buf):wav(buf),`goblin-candombe_${SEED}_rec-${Math.round(buf.duration)}s.${kind}`);}
$('bRec').onclick=()=>REC?recStop():recStart();

// ================= picture =================
const cv=$('cv'),G=cv.getContext('2d'),hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const ROWS=['madera','chico','repique','piano','bass','comp','pad','lead','counter','synths'];
function draw(){const P=PLAN,cols=[...new Set(PALS[P.pal].c)].map(hex).sort((a,b)=>(a[0]+a[1]+a[2])-(b[0]+b[1]+b[2])),bg=cols[0],hi=cols[cols.length-1],rgb=(c,a=1)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
 const now=ctx?ctx.currentTime:0;let cur=null;for(const q of BARQ)if(q.t<=now)cur=q;BARQ=BARQ.filter(q=>q.t>now-4);
 const step=cur?Math.floor((now-cur.t)/cur.sps):-1,bar=cur?cur.bar:0,sps=cur?cur.sps:60/K.bpm/4,ev=barEvents(bar,sps);edNow(step);
 G.fillStyle=rgb(bg);G.fillRect(0,0,512,512);const cw=512/16,rh=(512-40)/ROWS.length;
 ROWS.forEach((rn,ri)=>{G.fillStyle=rgb(cols[(ri%(cols.length-1))+1],.08);G.fillRect(0,40+ri*rh,512,rh-2);});
 ev.forEach(e=>{const ri=ROWS.indexOf(e.d||e.role||'synths');if(ri<0)return;const c=cols[1+((ri+e.s)%(cols.length-1))],hot=e.s===step,sz=e.d?(e.st==='mute'?.45:e.st==='palo'?.75:1)*Math.min(1,.4+e.v):Math.min(1,.45+(e.fs?e.fs.length*.12:.2));
  const w=cw*sz*.9,h=(rh-4)*sz,x=e.s*cw+(cw-w)/2,y=40+ri*rh+(rh-2-h)/2;G.fillStyle=rgb(c,hot?1:.7);if(e.d&&e.st==='madera'){G.fillRect(x+w*.25,y,w*.5,h);}else G.fillRect(x,y,w,h);
  if(hot){G.strokeStyle=rgb(hi);G.lineWidth=2;G.strokeRect(x-2,y-2,w+4,h+4);}});
 if(step>=0){G.fillStyle=rgb(hi,.12);G.fillRect(step*cw,40,cw,472);}
 G.fillStyle=rgb(hi);G.font='13px Courier New';G.fillText(`bar ${bar+1} · ${Math.round(bpmAt(bar))} bpm · ${NOTE_NAMES[P.root]} ${P.sn} · ${Math.floor(bar/K.section)%2?'B':'A'}`,10,24);
 ROWS.forEach((rn,ri)=>{G.fillStyle=rgb(hi,.5);G.font='10px Courier New';G.fillText(rn,4,40+ri*rh+12);});
 if(timer)requestAnimationFrame(draw);}
function info(){$('info').textContent=`seed ${SEED} · lead ${role('lead')} · comp ${role('comp')} · pad ${role('pad')}`;if(!timer)draw();}

// ================= pattern editor =================
function buildEd(){const h=['<h4>THE CUERDA · click a step to change its stroke, right-click to empty it</h4>'];
 DRUMS.forEach(d=>{h.push(`<div class="er"><span class="nm">${d}</span>`);for(let s=0;s<16;s++){const x=PAT[d][s];h.push(`<button class="c${s%4===0?' b':''}${x?' on':''}" data-d="${d}" data-s="${s}" title="${x?x.st:'empty'}">${x?SYM[x.st]:'·'}</button>`);}
  h.push(`<button class="t" data-a="left" data-d="${d}" title="move left">◀</button><button class="t" data-a="right" data-d="${d}" title="move right">▶</button><button class="t" data-a="rev" data-d="${d}" title="reverse">⇄</button><button class="t" data-a="inv" data-d="${d}" title="invert hits and rests">◐</button><button class="t" data-a="swap" data-d="${d}" title="swap strokes: open↔muted, stick↔wood">↕</button><button class="t" data-a="mut" data-d="${d}" title="change a few steps">✱</button><button class="t" data-a="rnd" data-d="${d}" title="new random pattern">⚄</button><button class="t" data-a="clr" data-d="${d}" title="clear">✕</button><button class="t" data-a="rst" data-d="${d}" title="back to the start">↺</button></div>`);});
 h.push(`<div class="er"><button class="t" data-a="mutall">✱ change all a little</button><button class="t" data-a="rstall">↺ reset all</button><span id="legend">● open hand · ○ muted hand · ▲ stick on the head · ▪ stick on the wood</span></div>`);
 $('ed').innerHTML=h.join('');
 $('ed').querySelectorAll('.c').forEach(b=>{const d=b.dataset.d,s=+b.dataset.s;
  b.onclick=()=>{const x=PAT[d][s],i=x?STROKES.indexOf(x.st):-1;PAT[d][s]=i===3?null:{st:STROKES[i+1],v:x?x.v:.7};if(d==='piano')pianoEdited=true;buildEd();draw();};
  b.oncontextmenu=e=>{e.preventDefault();PAT[d][s]=null;if(d==='piano')pianoEdited=true;buildEd();draw();};});
 $('ed').querySelectorAll('.t').forEach(b=>b.onclick=()=>{const a=b.dataset.a,d=b.dataset.d,r=Math.random;
  const one=d=>{const p=PAT[d];if(a==='left')PAT[d]=p.slice(1).concat(p[0]);if(a==='right')PAT[d]=[p[15]].concat(p.slice(0,15));if(a==='rev')PAT[d]=p.slice().reverse();
   if(a==='inv'){const st=(p.find(x=>x)||{st:'open'}).st;PAT[d]=p.map(x=>x?null:{st:d==='madera'?'madera':st,v:.6});}
   if(a==='swap')PAT[d]=p.map(x=>x&&{st:SWAP[x.st],v:x.v});
   if(a==='mut'||a==='mutall')PAT[d]=p.map((x,i)=>r()<.8?x:r()<.5?(x?null:{st:STROKES[Math.floor(r()*4)],v:.4+r()*.5}):x&&{st:STROKES[Math.floor(r()*4)],v:x.v});
   if(a==='rnd')PAT[d]=Array.from({length:16},(_,s)=>r()<(s%4===0?.6:.35)?{st:d==='madera'?'madera':STROKES[Math.floor(r()*4)],v:.4+r()*.6}:null);
   if(a==='clr')PAT[d]=Array(16).fill(null);if(a==='rst'||a==='rstall')PAT[d]=defaultPat(d);if(d==='piano')pianoEdited=!(a==='rst'||a==='rstall');};
  if(d)one(d);else DRUMS.forEach(one);buildEd();draw();});}
let lastNow=-2;function edNow(step){if(step===lastNow)return;lastNow=step;$('ed').querySelectorAll('.c.now').forEach(b=>b.classList.remove('now'));if(step>=0)$('ed').querySelectorAll(`.c[data-s="${step}"]`).forEach(b=>b.classList.add('now'));}

// ================= knobs =================
const ROOT={K,DT};const getp=p=>p.split('.').reduce((o,k)=>o[k],ROOT),setp=(p,v)=>{const ks=p.split('.'),l=ks.pop();ks.reduce((o,k)=>o[k],ROOT)[l]=v;};
function knobs(){const h=[],sec=t=>h.push(`<h4>${t}</h4>`),
 rng=(p,l,mn,mx,st,g)=>h.push(`<div class="kr"><label>${l}</label><input type="range" data-p="${p}" data-g="${g||''}" min="${mn}" max="${mx}" step="${st}" value="${getp(p)}"><output>${getp(p)}</output></div>`),
 sel=(p,l,o,g)=>h.push(`<div class="kr"><label>${l}</label><select data-p="${p}" data-g="${g||''}">${o.map(([v,t])=>`<option value="${v}" ${String(getp(p))===String(v)?'selected':''}>${t}</option>`).join('')}</select><output></output></div>`),
 tog=(p,l,g)=>h.push(`<div class="kr" style="grid-template-columns:120px 1fr"><label>${l}</label><div class="ck"><label><input type="checkbox" data-p="${p}" data-g="${g||''}" ${getp(p)?'checked':''}> on</label></div></div>`),
 cks=(base,keys,l,g)=>h.push(`<div class="kr" style="grid-template-columns:120px 1fr"><label>${l}</label><div class="ck">${keys.map(k=>`<label><input type="checkbox" data-p="${base}.${k}" data-g="${g||''}" ${getp(base+'.'+k)?'checked':''}> ${k}</label>`).join('')}</div></div>`);
 sec('THE CUERDA');rng('K.bpm','tempo (bpm)',70,180,1);rng('K.swing','swing / lilt',0,1,.01);tog('K.llamada','llamada (speeds up)');rng('K.wild','repique wildness',0,1,.05);
 sel('K.pianoStyle','piano line',[[-1,'from the seed']].concat(PIANOS.map((p,i)=>[i,p.n])),'piano');
 DRUMS.forEach(d=>{h.push(`<details><summary>${d} · sound and movement</summary>`);const b='DT.'+d+'.';
  tog(b+'mute','mute','fx');sel(b+'snd','sound',Object.keys(SND).map(k=>[k,k]));rng(b+'vol','volume',0,2,.05);rng(b+'tune','tune (semitones)',-24,24,1);rng(b+'decay','decay',.2,4,.05);rng(b+'tone','tone / brightness',.2,3,.05);
  rng(b+'bend','pitch drop (− = rises)',-1,4,.05);rng(b+'drive','drive / dirt',0,1,.02,'fx');rng(b+'pan','left ↔ right',-1,1,.05,'fx');tog(b+'rsnd','backwards sound');
  rng(b+'shift','move steps',-8,8,1);tog(b+'rev','reverse pattern');tog(b+'inv','invert (hits ↔ rests)');tog(b+'swap','swap strokes');
  rng(b+'prob','hit chance',0,1,.05);rng(b+'human','human feel',0,1,.05);rng(b+'mutate','changes every bar',0,1,.05);h.push('</details>');});
 sec('THE BAND');tog('K.ens','new seed picks the band','ens');cks('K.ins',BAND,'instruments','band');
 sel('K.lead','lead',[['auto','from the seed']].concat(BAND.filter(k=>k!=='bass').map(k=>[k,k])),'role');sel('K.comp','rhythm chords',[['auto','from the seed']].concat(['guitar','epiano','organ','bandoneon','vibes','horns'].map(k=>[k,k])),'role');
 sel('K.pad','held chords',[['auto','from the seed']].concat(['choir','bandoneon','organ','epiano','horns'].map(k=>[k,k])),'role');
 h.push('<details><summary>band volumes</summary>');BAND.forEach(k=>rng('K.vol.'+k,k,0,1.5,.05,'fx'));h.push('</details>');
 rng('K.color','chord colour (triad → 9th)',0,1,.05);sel('K.change','chords per bar',[[1,'one'],[2,'two']]);rng('K.reg','register (octave)',-1,1,1);
 rng('K.motif','melody repeats',0,1,.05);rng('K.call','lead answers repique',0,1,.05);rng('K.busy','busy',0,1,.05);sel('K.section','section length (bars)',[[4,4],[8,8],[16,16],[32,32]]);
 sel('K.key','key',[[-1,'from the seed']].concat(NOTE_NAMES.map((n,i)=>[i,n])),'plan');sel('K.scale','scale',[['auto','from the seed']].concat(Object.keys(MUSIC_SCALES).map(k=>[k,k])),'plan');
 sec('GOBLIN DAY SYNTHS');rng('K.synth','synth volume',0,1.5,.05,'fx');cks('K.voice',Object.keys(K.voice),'voices');rng('K.mdens','note density',0,3,.05);rng('K.weird','weirdness',0,1,.05);rng('K.mglitch','glitch',0,1,.05);
 sec('ROOM');rng('K.rev','reverb',0,1.5,.05,'fx');rng('K.fb','delay feedback',0,.9,.02,'fx');rng('K.dtime','delay time',.05,1.2,.01,'fx');rng('K.master','volume',0,2,.05,'fx');
 h.push(`<div class="note">everything is synthesised by code, no recordings. the piano lines are approximations, not taken from a specific comparsa. pattern and band changes are heard from the next bar.</div>`);
 $('knobs').innerHTML=h.join('');
 $('knobs').querySelectorAll('[data-p]').forEach(el=>el.addEventListener(el.type==='range'?'input':'change',()=>{const p=el.dataset.p,g=el.dataset.g;
  let v=el.type==='checkbox'?el.checked:el.type==='range'?+el.value:(isNaN(+el.value)?el.value:+el.value);
  if(p==='K.ens')v=v?'seed':'manual';if(g==='band')K.ens='manual';setp(p,v);if(el.type==='range')el.nextElementSibling.textContent=v;
  if(g==='ens'&&v==='seed'){Object.assign(K.ins,PLAN.ens);syncUI();}
  if(g==='plan'){PLAN=plan();}if(g==='piano'){PLAN=plan();PAT.piano=defaultPat('piano');pianoEdited=false;buildEd();}
  if(ch)ch.set();info();}));}
function syncUI(){$('knobs').querySelectorAll('[data-p]').forEach(el=>{const v=getp(el.dataset.p);if(el.type==='checkbox')el.checked=el.dataset.p==='K.ens'?v==='seed':!!v;});}
PLAN=plan();Object.assign(K.ins,PLAN.ens);DRUMS.forEach(d=>PAT[d]=defaultPat(d));knobs();buildEd();info();
window.__api={K,DT,PAT,render,barEvents,plan:()=>PLAN,wav,recStart,recStop,get rec(){return REC}};
